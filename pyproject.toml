[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "classicrypt"
version = "1.0.0"
description = "Educational toolkit of classical ciphers with automated cryptanalysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["cryptography", "classical-ciphers", "cryptanalysis", "education", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security :: Cryptography",
    "Topic :: Education",
]

[project.scripts]
classicrypt = "classicrypt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
